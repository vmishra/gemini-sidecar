name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Please report it privately instead (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of /gemini:status or ./install.sh --doctor
      description: Neither prints secret values.
      render: text
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options: [Claude Code, Codex CLI, Cursor, Other]
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [Gemini API key, Vertex AI]
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "plugin 2.0.0, Claude Code 2.1.x, Python 3.12, macOS 15"
