name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Doctor (read-only)
        run: ./install.sh --doctor --json

      - name: Installer dry run
        run: ./install.sh --codex --cursor --gateway-profile all-gemini --project "$RUNNER_TEMP" --dry-run

      - name: Offline checks and unit tests
        run: ./verify.sh

  # Oldest supported Python. Hosted runners no longer ship 3.9, so use the official image.
  verify-python39:
    name: python:3.9 container
    runs-on: ubuntu-latest
    container: python:3.9@sha256:da5aee29682d12a6649f51c8d6f15b87deb3e6c524b923c41d0cb3304d07c913
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Offline checks and unit tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./install.sh --doctor --json
          ./verify.sh
