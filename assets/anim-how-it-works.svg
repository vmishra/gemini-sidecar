, sans-serif" font-size="13" font-weight="650" fill="#1A7F37" text-anchor="middle" >1,958-token answer, ~$0.085</text><text class="rettxt" x="715" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#1A7F37" text-anchor="middle" >with path:line citations</text><path class="rettxt" d="M141 268 L147 257 L153 268 Z" fill="#1A7F37"/></svg>
