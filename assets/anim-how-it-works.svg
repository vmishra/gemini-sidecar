<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-labelledby="t d"><title id="t">What happens when you run a command</title><desc id="d">The agent passes paths to the local MCP server, which reads and filters files and sends 103,003 tokens to Gemini; a 1,958-token answer returns to the agent.</desc><rect x="1" y="1" width="1038" height="498" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636E"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1A7F37"/></marker></defs><style>
.band{transform-box:fill-box;transform-origin:left center;animation:band 9.0s cubic-bezier(.4,0,.2,1) infinite}
@keyframes band{0%,8%{transform:scaleX(0)}28%,92%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
.bandtxt{animation:bandtxt 9.0s linear infinite}
@keyframes bandtxt{0%,24%{opacity:0}30%,92%{opacity:1}97%,100%{opacity:0}}
.ret{stroke-dasharray:1200;animation:ret 9.0s cubic-bezier(.4,0,.2,1) infinite}
@keyframes ret{0%,40%{stroke-dashoffset:1200}66%,92%{stroke-dashoffset:0}97%,100%{stroke-dashoffset:1200}}
.rettxt{animation:rettxt 9.0s linear infinite}
@keyframes rettxt{0%,60%{opacity:0}68%,92%{opacity:1}97%,100%{opacity:0}}
.pulse{animation:pulse 9.0s linear infinite}
@keyframes pulse{0%,28%{stroke-width:1.5}33%{stroke-width:3.5}40%,100%{stroke-width:1.5}}
@media (prefers-reduced-motion:reduce){.band,.bandtxt,.ret,.rettxt,.pulse{animation:none!important}}
