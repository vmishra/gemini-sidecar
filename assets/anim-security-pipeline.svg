<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d"><title id="t">What happens before anything leaves your machine</title><desc id="d">Files pass four checks (inside the project, tracked by git, not a secret file, tokens redacted) before being sent to Gemini; rejected files drop out with the reason.</desc><rect x="1" y="1" width="1038" height="468" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8C959F"/></marker></defs><style>@keyframes fadeIn{0%,3%{opacity:0}6%,92%{opacity:1}97%,100%{opacity:0}}@keyframes mv0{0%,5.00%{transform:translateX(0)}33.33%,100%{transform:translateX(776px)}}.mv0{animation:mv0 12.0s cubic-bezier(.4,0,.2,1) infinite}@keyframes mv1{0%,7.92%{transform:translateX(0)}17.92%,100%{transform:translateX(8px)}}.mv1{animation:mv1 12.0s cubic-bezier(.4,0,.2,1) infinite}@keyframes st1{0%,17.92%{opacity:0}19.58%,92%{opacity:1}97%,100%{opacity:0}}.st1{opacity:0;animation:st1 12.0s linear infinite}@keyframes fd1{0%,17.92%{opacity:1}22.92%,100%{opacity:.28}}.fd1{animation:fd1 12.0s linear infinite}@keyframes mv2{0%,10.83%{transform:translateX(0)}25.42%,100%{transform:translateX(200px)}}.mv2{animation:mv2 12.0s cubic-bezier(.4,0,.2,1) infinite}@keyframes st2{0%,25.42%{opacity:0}27.08%,92%{opacity:1}97%,100%{opacity:0}}.st2{opacity:0;animation:st2 12.0s linear infinite}@keyframes fd2{0%,25.42%{opacity:1}30.42%,100%{opacity:.28}}.fd2{animation:fd2 12.0s linear infinite}@keyframes mv3{0%,13.75%{transform:translateX(0)}32.92%,100%{transform:translateX(392px)}}.mv3{animation:mv3 12.0s cubic-bezier(.4,0,.2,1) infinite}@keyframes st3{0%,32.92%{opacity:0}34.58%,92%{opacity:1}97%,100%{opacity:0}}.st3{opacity:0;animation:st3 12.0s linear infinite}@keyframes fd3{0%,32.92%{opacity:1}37.92%,100%{opacity:.28}}.fd3{animation:fd3 12.0s linear infinite}@keyframes mv4{0%,16.67%{transform:translateX(0)}45.00%,100%{transform:translateX(776px)}}.mv4{animation:mv4 12.0s cubic-bezier(.4,0,.2,1) infinite}@keyframes rd4{0%,40.42%{opacity:0}42.08%,92%{opacity:1}97%,100%{opacity:0}}.rd4{opacity:0;animation:rd4 12.0s linear infinite}@keyframes mv5{0%,19.58%{transform:translateX(0)}34.17%,100%{transform:translateX(200px)}}.mv5{animation:mv5 12.0s cubic-bezier(.4,0,.2,1) infinite}@keyframes st5{0%,34.17%{opacity:0}35.83%,92%{opacity:1}97%,100%{opacity:0}}.st5{opacity:0;animation:st5 12.0s linear infinite}@keyframes fd5{0%,34.17%{opacity:1}39.17%,100%{opacity:.28}}.fd5{animation:fd5 12.0s linear infinite}@keyframes mv6{0%,22.50%{transform:translateX(0)}50.83%,100%{transform:translateX(776px)}}.mv6{animation:mv6 12.0s cubic-bezier(.4,0,.2,1) infinite}@media (prefers-reduced-motion:reduce){[class^=mv],[class^=st],[class^=fd],[class^=rd]{animation:none!important}[class^=st],[class^=rd]{opacity:1!important}}</style><text x="36" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#1F2328" text-anchor="start" >What happens before anything leaves your machine</text><text x="36" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636E" text-anchor="start" >Every file the agent points at goes through these checks, in this order. Only what survives is sent.</text><rect x="36" y="120" width="176" height="74" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="52" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1F2328" text-anchor="start" >Inside the project?</text><text x="52" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636E" text-anchor="start" >no ../, no symlinks out</text><path d="M214 157 h12" stroke="#8C959F" stroke-width="1.5" marker-end="url(#a)"/><rect x="228" y="120" width="176" height="74" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="244" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1F2328" text-anchor="start" >Tracked by git?</text><text x="244" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636E" text-anchor="start" >.gitignore always applies</text><path d="M406 157 h12" stroke="#8C959F" stroke-width="1.5" marker-end="url(#a)"/><rect x="420" y="120" width="176" height="74" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="436" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1F2328" text-anchor="start" >A secret file?</text><text x="436" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636E" text-anchor="start" >.env, keys, .ssh/, .aws/</text><path d="M598 157 h12" stroke="#8C959F" stroke-width="1.5" marker-end="url(#a)"/><rect x="612" y="120" width="176" height="74" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/><text x="628" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1F2328" text-anchor="start" >Redact tokens</text><text x="628" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636E" text-anchor="start" >keys, tokens, passwords</text><path d="M790 157 h12" stroke="#8C959F" stroke-width="1.5" marker-end="url(#a)"/><rect x="804" y="120" width="176" height="74" rx="12" fill="#EBF2FF" stroke="#1A56DB" stroke-width="1.5"/><text x="820" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1E3A8A" text-anchor="start" >Send to Gemini</text><text x="820" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636E" text-anchor="start" >API key or Vertex AI</text><g class="mv0"><g class=""><rect x="36" y="224" width="140" height="22" rx="11" fill="#FFFFFF" stroke="#D0D7DE"/><text x="48" y="239" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1F2328" text-anchor="start" >src/app.py</text></g></g><g class="mv1"><g class="fd1"><rect x="36" y="253" width="150" height="22" rx="11" fill="#FFFFFF" stroke="#E5A1A1"/><text x="48" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1F2328" text-anchor="start" >~/.ssh/id_rsa</text></g><g class="st1"><text x="196" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B42318" text-anchor="start" >✕ outside project</text></g></g><g class="mv2"><g class="fd2"><rect x="36" y="282" width="150" height="22" rx="11" fill="#FFFFFF" stroke="#E5A1A1"/><text x="48" y="297" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1F2328" text-anchor="start" >node_modules/x.js</text></g><g class="st2"><text x="196" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B42318" text-anchor="start" >✕ gitignored</text></g></g><g class="mv3"><g class="fd3"><rect x="36" y="311" width="150" height="22" rx="11" fill="#FFFFFF" stroke="#E5A1A1"/><text x="48" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1F2328" text-anchor="start" >.env</text></g><g class="st3"><text x="196" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B42318" text-anchor="start" >✕ secret file</text></g></g><g class="mv4"><g class=""><rect x="36" y="340" width="150" height="22" rx="11" fill="#FFFFFF" stroke="#D0D7DE"/><text x="48" y="355" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1F2328" text-anchor="start" >config.py  AIza…</text></g></g><g class="rd4"><text x="620" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B35900" text-anchor="start" >key → [REDACTED]</text></g><g class="mv5"><g class="fd5"><rect x="36" y="369" width="150" height="22" rx="11" fill="#FFFFFF" stroke="#E5A1A1"/><text x="48" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1F2328" text-anchor="start" >local_settings.py</text></g><g class="st5"><text x="196" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B42318" text-anchor="start" >✕ gitignored</text></g></g><g class="mv6"><g class=""><rect x="36" y="398" width="140" height="22" rx="11" fill="#FFFFFF" stroke="#D0D7DE"/><text x="48" y="413" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1F2328" text-anchor="start" >tests/test_app.py</text></g></g><text x="36" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >Generated code is never written to your files: it goes to .gemini4-staging/ for you to review.</text></svg>
