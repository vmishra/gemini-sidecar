<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 416" width="1120" height="416" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Cache-Preserving Coexistence Architecture</title>
  <desc id="arch-desc">Root planner thread stays session-pinned to preserve warm prefix caches while offloading subagents to Gemini 3.8 Flash, bulk disk reads to Gemini 4 Argon via stdio MCP, and background tasks to Gemini 3.5 Flash-Lite.</desc>

  <!-- Outer Canvas -->
  <rect x="4" y="4" width="1112" height="408" rx="14" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>

  <!-- Section Header -->
  <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1A73E8" letter-spacing="0.5">CONTEXT-BOUNDARY OFFLOAD ARCHITECTURE</text>
  <text x="1084" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#5F6368">Zero Mid-Thread Provider Switches</text>

  <!-- Top Root Session Banner (Google Blue) -->
  <rect x="36" y="54" width="1048" height="92" rx="10" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.75"/>
  <text x="60" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#174EA6">DEVELOPER HARNESS  —  Claude Code  ·  OpenAI Codex CLI  ·  Cursor IDE</text>
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#202124">Root Planner Thread stays locked via <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">SESSION_PINS</tspan> (<tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">claude-opus-5-5</tspan> in Hybrid or <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">gemini-4-argon</tspan> in All-Gemini)</text>
  <text x="60" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#5F6368">Preserves 100% warm prefix cache · Prevents $5.00/1M cache-write penalties &amp; cross-provider tool_use.id 400 errors</text>

  <rect x="886" y="72" width="174" height="32" rx="16" fill="#FFFFFF" stroke="#4285F4"/>
  <text x="973" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#174EA6">100% Cache Warm</text>

  <!-- Connector Lines & Arrows -->
  <g stroke="#80868B" stroke-width="1.75" fill="none">
    <line x1="204" y1="146" x2="204" y2="206"/>
    <polyline points="198,199 204,207 210,199"/>

    <line x1="560" y1="146" x2="560" y2="206"/>
    <polyline points="554,199 560,207 566,199"/>

    <line x1="916" y1="146" x2="916" y2="206"/>
    <polyline points="910,199 916,207 922,199"/>
  </g>

  <!-- Connector Labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#5F6368">
    <rect x="92" y="164" width="224" height="24" rx="12" fill="#F8F9FA" stroke="#DADCE0"/>
    <text x="204" y="180" text-anchor="middle">Isolated Subagent HTTP Thread</text>

    <rect x="444" y="164" width="232" height="24" rx="12" fill="#F8F9FA" stroke="#DADCE0"/>
    <text x="560" y="180" text-anchor="middle">Stdio File Pointers (paths[])</text>

    <rect x="798" y="164" width="236" height="24" rx="12" fill="#F8F9FA" stroke="#DADCE0"/>
    <text x="916" y="180" text-anchor="middle">Out-of-Band Role / 429 Guard</text>
  </g>

  <!-- Boundary 1: Subagent Workhorse (Google Green) -->
  <g transform="translate(36, 214)">
    <rect x="0" y="0" width="334" height="172" rx="10" fill="#F8F9FA" stroke="#DADCE0"/>
    <rect x="0" y="0" width="334" height="6" rx="3" fill="#34A853"/>
    <rect x="18" y="20" width="196" height="22" rx="5" fill="#E6F4EA"/>
    <text x="26" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#0D652D">1 · SUBAGENT WORKHORSE</text>
    <text x="18" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800" fill="#202124">gemini-3.8-flash</text>
    <text x="18" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#202124">• <tspan font-weight="700">133 tok/s</tspan> · $0.75 / $3.75 per 1M</text>
    <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#202124">• <tspan font-weight="700">89.4%</tspan> on Terminal-Bench 2.1</text>
    <text x="18" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#202124">• Runs grep/read/test loops isolated</text>
    <text x="18" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#137333">-83% subagent spend ($5.12 -&gt; $0.87)</text>
  </g>

  <!-- Boundary 2: File-Pointer MCP (Google Yellow) -->
  <g transform="translate(393, 214)">
    <rect x="0" y="0" width="334" height="172" rx="10" fill="#F8F9FA" stroke="#DADCE0"/>
    <rect x="0" y="0" width="334" height="6" rx="3" fill="#FBBC04"/>
    <rect x="18" y="20" width="206" height="22" rx="5" fill="#FEF7E0"/>
    <text x="26" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#5F370E">2 · FILE-POINTER DISK MCP</text>
    <text x="18" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800" fill="#202124">gemini-4-argon (1M)</text>
    <text x="18" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#202124">• <tspan font-weight="700">1,048,576</tspan> ctx · 65,536 max output</text>
    <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#202124">• Reads source trees straight off disk</text>
    <text x="18" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#202124">• Returns &lt;500-word synthesis to root</text>
    <text x="18" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#B06000">$0.10/1M cached · $0.00 write fee</text>
  </g>

  <!-- Boundary 3: Background & Failover (Google Red) -->
  <g transform="translate(750, 214)">
    <rect x="0" y="0" width="334" height="172" rx="10" fill="#F8F9FA" stroke="#DADCE0"/>
    <rect x="0" y="0" width="334" height="6" rx="3" fill="#EA4335"/>
    <rect x="18" y="20" width="224" height="22" rx="5" fill="#FCE8E6"/>
    <text x="26" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#A50E0E">3 · BACKGROUND &amp; 429 GUARD</text>
    <text x="18" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800" fill="#202124">gemini-3.5-flash-lite</text>
    <text x="18" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#202124">• <tspan font-weight="700">454 tok/s</tspan> · $0.30 / $1.20 per 1M</text>
    <text x="18" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#202124">• Haiku role, indexing &amp; safeguards</text>
    <text x="18" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#202124">• Sticky 429 quota failover to Argon</text>
    <text x="18" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#C5221F">Zero flap penalty on rate limits</text>
  </g>
</svg>
