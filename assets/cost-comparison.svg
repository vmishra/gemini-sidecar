<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 308" width="1120" height="308" role="img" aria-labelledby="cost-title cost-desc">
  <title id="cost-title">40-Turn Coding Session Cost Comparison</title>
  <desc id="cost-desc">Benchmark session cost across 40 root turns, 20 exploration subagents, and 30 background calls: Monolithic Opus 5.5 costs $7.97, Naive /model toggling costs $6.49, Hybrid Coexistence costs $3.17 (-60.2%), All-Gemini Standard costs $3.03 (-62.0%), and All-Gemini Intro costs $1.98 (-75.1%).</desc>

  <!-- Outer Card -->
  <rect x="4" y="4" width="1112" height="300" rx="14" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>

  <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#202124">40-Turn Coding Session Benchmark Cost  (40 Root Turns + 20 Subagents + 30 Background Calls)</text>
  <text x="1084" y="38" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#5F6368">Lower is better</text>

  <!-- Row 1: Monolithic Opus 5.5 ($7.97 = 560px) -->
  <g transform="translate(36, 62)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#202124">Monolithic claude-opus-5-5</text>
    <rect x="330" y="2" width="560" height="24" rx="5" fill="#9AA0A6"/>
    <text x="902" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#3C4043">$7.97  (Baseline — 64.2% subagents)</text>
  </g>

  <!-- Row 2: Naive /model Toggling ($6.49 = 456px) -->
  <g transform="translate(36, 108)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#5F6368">Naive Mid-Thread /model Toggling</text>
    <rect x="330" y="2" width="456" height="24" rx="5" fill="#EA4335" opacity="0.82"/>
    <text x="798" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#C5221F">$6.49  (-18.5% · cache thrash + 400 risk)</text>
  </g>

  <!-- Row 3: Hybrid Coexistence ($3.17 = 223px) -->
  <g transform="translate(36, 154)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#174EA6">Hybrid: Opus 5.5 Root + Gemini Subagents</text>
    <rect x="330" y="2" width="223" height="24" rx="5" fill="#4285F4"/>
    <text x="565" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800" fill="#174EA6">$3.17  (-60.2% · zero root UX change)</text>
  </g>

  <!-- Row 4: All-Gemini Standard Dec 1+ ($3.03 = 213px) -->
  <g transform="translate(36, 200)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#5F370E">All-Gemini Tiered (Standard Rate Dec 1+)</text>
    <rect x="330" y="2" width="213" height="24" rx="5" fill="#FBBC04"/>
    <text x="555" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800" fill="#B06000">$3.03  (-62.0% · $0.00 cache-write fee)</text>
  </g>

  <!-- Row 5: All-Gemini Intro ($1.98 = 139px) -->
  <g transform="translate(36, 246)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#0D652D">All-Gemini Tiered (Argon Intro thru Nov 30)</text>
    <rect x="330" y="2" width="139" height="24" rx="5" fill="#34A853"/>
    <text x="481" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800" fill="#137333">$1.98  (-75.1% · $0.10/1M implicit cache)</text>
  </g>
</svg>
