<text x="520.0" y="22" text-anchor="middle" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-size:12.5px" fill="#8B949E">Claude Code · /gemini:analyze (real run, replayed)</text>
<text class="l k0" x="22" y="58"><tspan fill="#85E89D" font-weight="700">❯&#160;</tspan><tspan fill="#FFFFFF" font-weight="700">/gemini:analyze&#160;How&#160;does&#160;a&#160;request&#160;flow&#160;through&#160;this&#160;repo,&#160;and&#160;where&#160;are&#160;the&#160;security&#160;checks?&#160;.</tspan></text>
<text class="l k1" x="22" y="77"><tspan fill="#E6E8EB"></tspan></text>
<text class="l k2" x="22" y="96"><tspan fill="#B392F0">⏺&#160;</tspan><tspan fill="#B392F0">gemini4&#160;·&#160;gemini4_analyze_codebase(paths:&#160;[&quot;.&quot;],&#160;model_tier:&#160;&quot;flash&quot;)</tspan></text>
<text class="l k3" x="22" y="115"><tspan fill="#8B949E">&#160;&#160;⎿&#160;read&#160;39&#160;files&#160;from&#160;disk&#160;(~103K&#160;tokens)&#160;·&#160;2&#160;secret-like&#160;strings&#160;redacted&#160;·&#160;.gitignore&#160;respected</tspan></text>
<text class="l k4" x="22" y="134"><tspan fill="#E6E8EB"></tspan></text>
<text class="l k5" x="22" y="153"><tspan fill="#FFFFFF" font-weight="700">Main&#160;components</tspan></text>
<text class="l k6" x="22" y="172"><tspan fill="#E6E8EB">&#160;&#160;1.&#160;MCP&#160;server&#160;&#160;&#160;plugins/gemini/mcp/gemini4_mcp_server.py&#160;&#160;&#160;&#160;reads&#160;files&#160;locally,&#160;calls&#160;Gemini,&#160;answers</tspan></text>
<text class="l k7" x="22" y="191"><tspan fill="#E6E8EB">&#160;&#160;2.&#160;Plugin&#160;&#160;&#160;&#160;&#160;&#160;&#160;plugins/gemini/skills/,&#160;agents/&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;slash&#160;commands&#160;and&#160;subagents&#160;for&#160;Claude&#160;Code</tspan></text>
<text class="l k8" x="22" y="210"><tspan fill="#E6E8EB">&#160;&#160;3.&#160;Gateway&#160;&#160;&#160;&#160;&#160;&#160;router/gemini4_gateway.py&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;optional&#160;Anthropic&#160;Messages&#160;API,&#160;127.0.0.1</tspan></text>
<text class="l k9" x="22" y="229"><tspan fill="#E6E8EB"></tspan></text>
<text class="l k10" x="22" y="248"><tspan fill="#FFFFFF" font-weight="700">Flow&#160;A:&#160;MCP&#160;tool&#160;call</tspan></text>
<text class="l k11" x="22" y="267"><tspan fill="#E6E8EB">&#160;&#160;resolve_workspace()&#160;confines&#160;the&#160;root&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;gemini4_mcp_server.py:183</tspan></text>
<text class="l k12" x="22" y="286"><tspan fill="#E6E8EB">&#160;&#160;collect_files()&#160;expands&#160;via&#160;git&#160;ls-files,&#160;drops&#160;secrets&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;gemini4_mcp_server.py:271</tspan></text>
<text class="l k13" x="22" y="305"><tspan fill="#E6E8EB">&#160;&#160;call_gemini()&#160;sends&#160;the&#160;corpus,&#160;retries&#160;429&#160;and&#160;5xx&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;gemini4_mcp_server.py:534</tspan></text>
<text class="l k14" x="22" y="324"><tspan fill="#E6E8EB">&#160;&#160;stage_generated_files()&#160;writes&#160;only&#160;under&#160;.gemini4-staging/&#160;&#160;&#160;&#160;&#160;gemini4_mcp_server.py:747</tspan></text>
<text class="l k15" x="22" y="343"><tspan fill="#E6E8EB"></tspan></text>
<text class="l k16" x="22" y="362"><tspan fill="#FFFFFF" font-weight="700">Where&#160;security&#160;happens</tspan></text>
<text class="l k17" x="22" y="381"><tspan fill="#E6E8EB">&#160;&#160;•&#160;constant-time&#160;token&#160;check&#160;on&#160;every&#160;gateway&#160;endpoint&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;gemini4_gateway.py:269</tspan></text>
<text class="l k18" x="22" y="400"><tspan fill="#E6E8EB">&#160;&#160;•&#160;model&#160;IDs&#160;validated&#160;before&#160;they&#160;reach&#160;a&#160;URL&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;gemini4_gateway.py:292</tspan></text>
<text class="l k19" x="22" y="419"><tspan fill="#E6E8EB">&#160;&#160;•&#160;prompt&#160;text&#160;never&#160;logged&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;gemini4_gateway.py:218</tspan></text>
<text class="l k20" x="22" y="438"><tspan fill="#E6E8EB"></tspan></text>
<text class="l k21" x="22" y="457"><tspan fill="#8B949E">&#160;&#160;───</tspan></text>
<text class="l k22" x="22" y="476"><tspan fill="#9ECBFF">&#160;&#160;gemini-3.8-flash&#160;via&#160;vertex-ai&#160;|&#160;16.5s&#160;|&#160;input&#160;103,003&#160;tok&#160;|&#160;output&#160;1,958&#160;tok&#160;|&#160;~$0.085</tspan></text>
<text class="l k23" x="22" y="495"><tspan fill="#E6E8EB"></tspan></text>
<text class="l k24" x="22" y="514"><tspan fill="#85E89D">Only&#160;this&#160;answer&#160;(~2K&#160;tokens)&#160;entered&#160;the&#160;conversation.&#160;The&#160;103K&#160;tokens&#160;of&#160;source&#160;stayed&#160;with&#160;Gemini.</tspan></text>
<rect class="cover" x="37.7" y="44" width="763.9" height="19" fill="#0D1117"/>
<text class="spin" x="1018" y="115" text-anchor="end" fill="#B392F0">Gemini is reading…</text>
</svg>
