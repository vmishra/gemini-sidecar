<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" role="img" aria-labelledby="t d"><title id="t">What the gateway does</title><desc id="d">Main conversation, subagents and background calls are routed to claude-opus-5-5 or gemini-4-argon, gemini-3.8-flash and gemini-3.5-flash-lite depending on the profile.</desc><rect x="1" y="1" width="1038" height="428" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/><text x="36" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#1F2328" text-anchor="start" >What the gateway does</text><text x="36" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636E" text-anchor="start" >Claude Code sends three kinds of requests. The gateway decides where each one runs, and keeps</text><text x="36" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636E" text-anchor="start" >a conversation on the same model from start to finish.</text><rect x="410" y="140" width="170" height="226" rx="12" fill="#1F2328"/><text x="495.0" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#FFFFFF" text-anchor="middle" >Gateway</text><text x="495.0" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#C9D1D9" text-anchor="middle" >127.0.0.1:3456</text><text x="495.0" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#C9D1D9" text-anchor="middle" >token required</text><text x="712" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1F2328" text-anchor="middle" >Hybrid profile</text><text x="908" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1F2328" text-anchor="middle" >All-Gemini profile</text><rect x="36" y="144" width="300" height="60" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="56" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1F2328" text-anchor="start" >Main conversation</text><text x="56" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >what you type, and its replies</text><path d="M336 174 H410" stroke="#59636E" stroke-width="1.5"/><path d="M580 174 H620" stroke="#D0D7DE" stroke-width="1.5"/><rect x="620" y="158" width="184" height="32" rx="16" fill="#3D4451"/><text x="712" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >claude-opus-5-5</text><text x="712" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#59636E" text-anchor="middle" >forwarded to Anthropic</text><rect x="816" y="158" width="184" height="32" rx="16" fill="#1E3A8A"/><text x="908" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >gemini-4-argon</text><rect x="36" y="226" width="300" height="60" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="56" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1F2328" text-anchor="start" >Subagents</text><text x="56" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >Explore, Task and plugin agents</text><path d="M336 256 H410" stroke="#59636E" stroke-width="1.5"/><path d="M580 256 H620" stroke="#D0D7DE" stroke-width="1.5"/><rect x="620" y="240" width="184" height="32" rx="16" fill="#1A56DB"/><text x="712" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >gemini-3.8-flash</text><rect x="816" y="240" width="184" height="32" rx="16" fill="#1A56DB"/><text x="908" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >gemini-3.8-flash</text><rect x="36" y="308" width="300" height="60" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><text x="56" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#1F2328" text-anchor="start" >Background calls</text><text x="56" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >titles, summaries, safety checks</text><path d="M336 338 H410" stroke="#59636E" stroke-width="1.5"/><path d="M580 338 H620" stroke="#D0D7DE" stroke-width="1.5"/><rect x="620" y="322" width="184" height="32" rx="16" fill="#BFD4FE"/><text x="712" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="middle" >gemini-3.5-flash-lite</text><rect x="816" y="322" width="184" height="32" rx="16" fill="#BFD4FE"/><text x="908" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="middle" >gemini-3.5-flash-lite</text><path d="M36 380 H1004" stroke="#D0D7DE"/><text x="36" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636E" text-anchor="start" >You don&#x27;t need the gateway to use the commands. It&#x27;s for running Claude Code itself on Gemini models.</text></svg>
