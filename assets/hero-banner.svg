<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" width="1120" height="220" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">gemini4-harness-kit</title>
  <desc id="hero-desc">Gemini tools for Claude Code, Codex CLI and Cursor: offload large reads, security audits, reviews and long generations to Gemini without switching your agent's model.</desc>
  <defs>
    <clipPath id="card"><rect x="4" y="4" width="1112" height="212" rx="16"/></clipPath>
  </defs>
  <rect x="4" y="4" width="1112" height="212" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <g clip-path="url(#card)">
    <rect x="4" y="4" width="278" height="7" fill="#4285F4"/>
    <rect x="282" y="4" width="278" height="7" fill="#EA4335"/>
    <rect x="560" y="4" width="278" height="7" fill="#FBBC04"/>
    <rect x="838" y="4" width="278" height="7" fill="#34A853"/>
  </g>
  <text x="44" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#202124">gemini4-harness-kit</text>
  <text x="44" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#3C4043">Hand the heavy reading and writing to Gemini. Keep your coding agent.</text>
  <text x="44" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#5F6368">Claude Code plugin, Codex CLI and Cursor MCP server, and an optional local gateway.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1A73E8">
    <rect x="44" y="166" width="150" height="28" rx="14" fill="#E8F0FE"/><text x="119" y="185" text-anchor="middle">/gemini:analyze</text>
    <rect x="204" y="166" width="190" height="28" rx="14" fill="#E8F0FE"/><text x="299" y="185" text-anchor="middle">/gemini:security-audit</text>
    <rect x="404" y="166" width="140" height="28" rx="14" fill="#E8F0FE"/><text x="474" y="185" text-anchor="middle">/gemini:review</text>
    <rect x="554" y="166" width="150" height="28" rx="14" fill="#E8F0FE"/><text x="629" y="185" text-anchor="middle">/gemini:refactor</text>
    <rect x="714" y="166" width="170" height="28" rx="14" fill="#E8F0FE"/><text x="799" y="185" text-anchor="middle">/gemini:test-triage</text>
    <rect x="894" y="166" width="204" height="28" rx="14" fill="#E8F0FE"/><text x="996" y="185" text-anchor="middle">/gemini:ask-antigravity</text>
  </g>
</svg>
