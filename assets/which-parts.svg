<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 512" width="1040" height="512" role="img" aria-labelledby="t d"><title id="t">Which parts do I need?</title><desc id="d">Three layers: MCP server (all tools), commands and subagents (Claude Code plugin; Codex AGENTS.md; Cursor subagents), and an optional gateway for Claude Code only.</desc><rect x="1" y="1" width="1038" height="510" rx="14" fill="#FFFFFF" stroke="#D0D7DE"/><text x="36" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#1F2328" text-anchor="start" >Which parts do I need?</text><text x="36" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636E" text-anchor="start" >Each layer builds on the one below it. Most people install one line and stop.</text><text x="630" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1F2328" text-anchor="middle" >Claude Code</text><text x="790" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1F2328" text-anchor="middle" >Codex CLI</text><text x="950" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1F2328" text-anchor="middle" >Cursor</text><rect x="64" y="130" width="414" height="80" rx="10" fill="#F3F4F6" stroke="#D0D7DE"/><text x="84" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#1F2328" text-anchor="start" >Gateway</text><text x="84" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >Optional. Runs Claude Code&#x27;s subagents, background</text><text x="84" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >calls or whole session on Gemini models.</text><path d="M520 170 H1004" stroke="#D0D7DE" stroke-dasharray="2 4"/><rect x="582" y="156" width="96" height="28" rx="14" fill="#FFFFFF" stroke="#1F2328" stroke-dasharray="4 3"/><text x="630" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1F2328" text-anchor="middle" >optional</text><rect x="760" y="170" width="60" height="1.5" fill="#8C959F"/><rect x="920" y="170" width="60" height="1.5" fill="#8C959F"/><rect x="50" y="222" width="442" height="80" rx="10" fill="#DCE7FD" stroke="#DCE7FD"/><text x="70" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#1E3A8A" text-anchor="start" >Commands and subagents</text><text x="70" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >/gemini:review, /gemini:security-audit and seven more,</text><text x="70" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >plus subagents that hand big reads to Gemini.</text><path d="M520 262 H1004" stroke="#D0D7DE" stroke-dasharray="2 4"/><rect x="582" y="248" width="96" height="28" rx="14" fill="#1A56DB"/><text x="630" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >included</text><rect x="734" y="248" width="112" height="28" rx="14" fill="#EBF2FF" stroke="#1A56DB"/><text x="790" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="middle" >AGENTS.md</text><rect x="894" y="248" width="112" height="28" rx="14" fill="#EBF2FF" stroke="#1A56DB"/><text x="950" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A" text-anchor="middle" >2 subagents</text><rect x="36" y="314" width="470" height="80" rx="10" fill="#1A56DB" stroke="#1A56DB"/><text x="56" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="650" fill="#FFFFFF" text-anchor="start" >MCP server</text><text x="56" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >The engine: seven tools that read your files and call</text><text x="56" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#FFFFFF" text-anchor="start" >Gemini. Every layer above uses it.</text><path d="M520 354 H1004" stroke="#D0D7DE" stroke-dasharray="2 4"/><rect x="582" y="340" width="96" height="28" rx="14" fill="#1A56DB"/><text x="630" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >included</text><rect x="742" y="340" width="96" height="28" rx="14" fill="#1A56DB"/><text x="790" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >included</text><rect x="902" y="340" width="96" height="28" rx="14" fill="#1A56DB"/><text x="950" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >included</text><path d="M36 416 H1004" stroke="#D0D7DE"/><text x="56" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1F2328" text-anchor="start" >Install</text><text x="56" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >Each command sets up everything marked for that tool.</text><text x="56" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" >In Claude Code you can also run /plugin install gemini@gemini4-harness-kit.</text><rect x="552" y="426" width="156" height="30" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/><text x="630" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1F2328" text-anchor="middle" >./install.sh --claude</text><rect x="712" y="426" width="156" height="30" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/><text x="790" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1F2328" text-anchor="middle" >./install.sh --codex</text><rect x="872" y="426" width="156" height="30" rx="6" fill="#F6F8FA" stroke="#D0D7DE"/><text x="950" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#1F2328" text-anchor="middle" >./install.sh --cursor</text></svg>
