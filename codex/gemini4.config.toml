# ==============================================================================
# OpenAI Codex CLI — Gemini 4 Coexistence Profile (`~/.codex/gemini4.config.toml`)
# ==============================================================================
# Official Codex v0.134.0+ / v0.159+ Profile Layer:
#   - Launch Argon 1M Main + 3.8 Flash Subagents:
#       codex --profile gemini4
#   - Launch 3.8 Flash Main (133 tok/s):
#       codex --profile gemini4 --model claude-gemini-3.8-flash
#   - Keep GPT-5.4 Main + offload only Subagents (`explorer`) & MCP to Gemini:
#       codex --profile gemini4 -c model_provider='"openai"' --model gpt-5.4
#
# PROTOCOL NOTE (Why Direct AI Studio Base URL Fails on Codex v0.159+):
#   Codex v0.159+ speaks ONLY the OpenAI Responses API (`POST /v1/responses`).
#   Google AI Studio's `generativelanguage.googleapis.com/v1beta/openai` shim only
#   implements `/chat/completions`, so Codex connects via our local zero-dependency
#   `gemini4_gateway.py` (`http://127.0.0.1:3456/v1`) or LiteLLM Proxy (`:4000/v1`).

model_provider = "gemini4_gateway"
model = "claude-gemini-4-argon"
model_reasoning_effort = "high"
model_context_window = 1048576
model_auto_compact_token_limit = 850000
model_catalog_url = "http://127.0.0.1:3456/v1/models"

[agents]
max_threads = 6
max_depth = 1
default_subagent_model = "claude-gemini-3.8-flash"

[model_providers.gemini4_gateway]
name = "Gemini 4 Local Coexistence Gateway"
base_url = "http://127.0.0.1:3456/v1"
# NOTE: No `env_key` required for local `127.0.0.1:3456` gateway (prevents Codex
# startup errors when LITELLM_API_KEY is unset). Uncomment ONLY if pointing
# `base_url` at an authenticated remote LiteLLM Proxy:
# env_key = "LITELLM_API_KEY"
wire_api = "responses"
# CRITICAL FOR GEMINI 4 ARGON: Deep reasoning & 200-task security sweeps average
# 14.0-23 minutes before streaming output tokens. Set 2-hour SSE idle timeout!
stream_idle_timeout_ms = 7200000
stream_max_retries = 5
request_max_retries = 4
api_key_model_discovery = true

# --- Zero-Proxy File-Pointer MCP & Antigravity Second-Opinion Bridge ---
[mcp_servers.gemini4]
command = "python3"
args = ["__GEMINI4_MCP_SERVER_PATH__"]
startup_timeout_sec = 15
tool_timeout_sec = 1200

[mcp_servers.gemini4.env]
GEMINI4_PRIMARY_MODEL = "gemini-4-argon"
GEMINI4_SUBAGENT_MODEL = "gemini-3.8-flash"
GEMINI4_BACKGROUND_MODEL = "gemini-3.5-flash-lite"
