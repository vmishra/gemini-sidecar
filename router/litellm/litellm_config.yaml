# LiteLLM proxy configuration exposing Gemini under Claude Code-compatible model names.
#
# Claude Code's /model picker only lists gateway models whose ID contains "claude",
# hence the claude-gemini-* aliases. Point Claude Code at the proxy with
# ANTHROPIC_BASE_URL=http://<proxy>:4000 and a LiteLLM virtual key.
#
#   pip install "litellm[proxy]"
#   litellm --config router/litellm/litellm_config.yaml --port 4000
#
# This file is provided as a starting point and is not exercised by this repository's CI.
# For Vertex AI, replace `gemini/<model>` with `vertex_ai/<model>` and set
# vertex_project / vertex_location instead of api_key.

model_list:
  - model_name: claude-gemini-4-argon
    litellm_params:
      model: gemini/gemini-4-argon
      api_key: os.environ/GEMINI_API_KEY
      timeout: 1200

  - model_name: claude-gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: claude-gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # Optional pass-through for a hybrid setup with an Anthropic root model.
  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_UPSTREAM_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
